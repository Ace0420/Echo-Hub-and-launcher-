<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Echo Hub - Free voice-controlled games for blind and visually impaired players, by Asa Hartz Games">
    <title>Echo Hub - Games you play by voice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        #mainButton {
            flex: 1 1 auto;
            min-height: 55vh;
            width: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #mainButton:active {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        }

        #mainButton.listening {
            background: linear-gradient(135deg, #e94560 0%, #533483 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .status-text {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: bold;
            text-align: center;
            padding: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.5rem);
            opacity: 0.9;
            text-align: center;
            padding: 0 2rem;
        }

        .game-list {
            flex: 0 0 auto;
            background: #000;
            padding: 1rem;
        }

        .game-list h1 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .game-list ul {
            list-style: none;
        }

        .game-list a {
            display: block;
            color: #fff;
            font-size: 1.1rem;
            padding: 0.9rem 0.5rem;
            border-top: 1px solid #333;
            text-decoration: none;
        }

        .game-list a:focus,
        .game-list a:active {
            background: #16213e;
            outline: 3px solid #fff;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <button id="mainButton" aria-label="Echo Hub. Tap to speak, then say the name of a game.">
        <span class="status-text" id="statusText">TAP TO SPEAK</span>
        <span class="subtitle" id="subtitle" aria-live="polite">Say a game name, or say Help</span>
    </button>

    <!-- Real links, so a screen reader can open a game without using the microphone.
         This list is filled in from the GAMES list in the script below. -->
    <nav class="game-list" aria-label="Games">
        <h1>Echo Hub games</h1>
        <ul id="gameList"></ul>
    </nav>

    <script>
        // ============================================================
        // ECHO HUB - One doorway to every Echo game
        // Copyright 2025 Asa Hartz Games - FREE for the community
        //
        // BLIND FIRST. ALWAYS.
        // - Tap the big button, then say the name of a game.
        // - Or use a screen reader and pick a game from the list.
        // ============================================================

        // ============================================================
        // THE GAMES
        // To add a game, copy one block and change the four lines.
        // To move a game to a new version, change only its url.
        // "hears" is every word the microphone might hear for it.
        // ============================================================

        const GAMES = [
            {
                name: 'Echo Dungeon',
                url: 'https://ace0420.github.io/EchoDungeon-V16/',
                about: 'a dungeon adventure with a narrator who has opinions',
                hears: ['dungeon', 'dungeons', 'adventure', 'crawler']
            },
            {
                name: 'Echo Tactical Ops',
                url: 'https://ace0420.github.io/Echo-Tac-ops/',
                about: 'a tactical mission game',
                hears: ['tactical', 'tac ops', 'tack ops', 'tac-ops', 'tactics', 'tic tac', 'ops', 'mission', 'missions']
            },
            {
                name: 'Echo Blackjack',
                url: 'https://ace0420.github.io/Echo-Blackjack-V3/',
                about: 'the card game twenty one',
                hears: ['blackjack', 'black jack', 'twenty one', 'twenty-one', '21', 'cards']
            }
        ];

        const NUMBER_WORDS = [
            ['one', '1', 'first', 'won'],
            ['two', '2', 'second', 'to', 'too'],
            ['three', '3', 'third'],
            ['four', '4', 'fourth', 'for'],
            ['five', '5', 'fifth'],
            ['six', '6', 'sixth']
        ];

        // ============================================================
        // PAGE ELEMENTS AND STATE
        // ============================================================

        let isListening = false;
        let recognition = null;
        let hasSpokenWelcome = false;
        const synthesis = window.speechSynthesis;

        const mainButton = document.getElementById('mainButton');
        const statusText = document.getElementById('statusText');
        const subtitle = document.getElementById('subtitle');
        const gameList = document.getElementById('gameList');

        // Build the list of links from GAMES, so the two can never disagree.
        GAMES.forEach(function (game, index) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            link.href = game.url;
            link.textContent = (index + 1) + '. ' + game.name + ', ' + game.about;
            item.appendChild(link);
            gameList.appendChild(item);
        });

        // ============================================================
        // SPEAKING
        // ============================================================

        function speak(text, callback) {
            if (!synthesis || !window.SpeechSynthesisUtterance) {
                if (callback) callback();
                return;
            }

            try {
                synthesis.cancel();
            } catch (e) {
                // Ignore
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1;
            utterance.volume = 1;

            let finished = false;
            function done() {
                if (finished) return;
                finished = true;
                if (callback) callback();
            }
            utterance.onend = done;
            utterance.onerror = done;

            try {
                synthesis.speak(utterance);
            } catch (e) {
                done();
            }
        }

        function updateStatus(text, subtext) {
            statusText.textContent = text;
            subtitle.textContent = subtext || '';
        }

        function vibrate(pattern) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern || [50]);
            }
        }

        function gamesSpoken() {
            return GAMES.map(function (game, index) {
                return (index + 1) + ', ' + game.name + ', ' + game.about;
            }).join('. ') + '.';
        }

        // ============================================================
        // LISTENING
        // ============================================================

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                speak('Sorry, this browser cannot listen. You can still pick a game from the list on this page with your screen reader.');
                updateStatus('VOICE NOT SUPPORTED', 'Pick a game from the list below');
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function () {
                isListening = true;
                mainButton.classList.add('listening');
                updateStatus('LISTENING...', 'Speak now');
                vibrate([50]);
            };

            recognition.onresult = function (event) {
                handleCommand(event.results[0][0].transcript);
            };

            recognition.onerror = function (event) {
                isListening = false;
                mainButton.classList.remove('listening');
                updateStatus('TAP TO SPEAK', 'Say a game name, or say Help');

                if (event.error === 'no-speech') {
                    speak('I did not hear anything. Tap to try again.');
                } else if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    speak('The microphone is blocked. Please allow the microphone for this page, or pick a game from the list with your screen reader.');
                }
            };

            recognition.onend = function () {
                isListening = false;
                mainButton.classList.remove('listening');
            };

            return true;
        }

        function startListening() {
            if (!recognition && !initSpeechRecognition()) return;
            if (isListening) return;

            try {
                if (synthesis) synthesis.cancel();
            } catch (e) {
                // Ignore
            }

            try {
                recognition.start();
            } catch (error) {
                speak('The microphone did not start. Tap to try again.');
            }
        }

        // ============================================================
        // COMMANDS
        // ============================================================

        function findGame(command) {
            // By name, or by any word the microphone might hear for it.
            // Whole words only, so "oops" does not count as "ops".
            const plain = function (text) { return ' ' + text.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' '; };
            const said = plain(command);
            for (const game of GAMES) {
                if (said.includes(plain(game.name))) return game;
            }
            for (const game of GAMES) {
                if (game.hears.some(function (word) { return said.includes(plain(word)); })) return game;
            }
            // By number. "The third one" means three, so listen for first, second, third before one, two, three.
            const words = said.trim().split(' ');
            const count = Math.min(GAMES.length, NUMBER_WORDS.length);
            for (let i = 0; i < count; i++) {
                if (words.includes(NUMBER_WORDS[i][2])) return GAMES[i];
            }
            for (let i = 0; i < count; i++) {
                if (words.includes(NUMBER_WORDS[i][0]) || words.includes(NUMBER_WORDS[i][1])) return GAMES[i];
            }
            // Sound-alikes such as "to" and "for" only count when said alone or after "number".
            if (words.length === 1 || words.includes('number')) {
                for (let i = 0; i < count; i++) {
                    if (NUMBER_WORDS[i].some(function (word) { return words.includes(word); })) return GAMES[i];
                }
            }
            return null;
        }

        function openGame(game) {
            updateStatus('OPENING...', game.name);
            vibrate([100, 50, 100]);
            speak('Opening ' + game.name + '.', function () {
                window.location.href = game.url;
            });
        }

        function handleCommand(heard) {
            const command = String(heard || '').toLowerCase().trim();
            vibrate([30, 30, 30]);

            if (command.includes('help')) {
                const helpText = 'Say the name of a game, or its number, to open it. Say games to hear the list. The games are: ' + gamesSpoken();
                speak(helpText);
                updateStatus('HELP', 'Say a game name or its number');
                return;
            }

            const game = findGame(command);
            if (game) {
                openGame(game);
                return;
            }

            if (command.includes('what') || command.includes('list') || command.includes('games') ||
                command.includes('repeat') || command.includes('again')) {
                speak('You can play: ' + gamesSpoken() + ' Tap, then say a name or a number.');
                updateStatus('GAMES', GAMES.map(function (g) { return g.name; }).join(', '));
                return;
            }

            speak('I heard, ' + command + '. I do not have a game by that name. Say games to hear the list.');
            updateStatus('TAP TO SPEAK', 'Say a game name, or say Help');
        }

        // ============================================================
        // THE BIG BUTTON
        // The first tap speaks the welcome. Browsers do not let a page
        // talk until it has been touched, so a welcome spoken on load
        // is often silent. Every tap after that listens.
        // ============================================================

        function handleClick() {
            if (!hasSpokenWelcome) {
                hasSpokenWelcome = true;
                speak('Welcome to Echo Hub, free voice games from Asa Hartz Games. You can play: ' + gamesSpoken() +
                      ' Tap anywhere, then say a name or a number.');
                return;
            }
            startListening();
        }

        mainButton.addEventListener('click', handleClick);
    </script>
</body>
</html>
